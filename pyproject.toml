[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fynura"
version = "0.1.0"
description = "Traceable, agentic public-health intelligence"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
  "countryinfo>=0.1.2,<0.2",
  "pycountry>=24.6,<25",
  "openpyxl>=3.1,<4",
  "PyYAML>=6,<7",
  "google-adk>=1.18,<2",
  "google-cloud-firestore>=2.19,<3",
  "google-cloud-logging>=3.11,<4",
  "google-cloud-trace>=1.13,<2",
  "firebase-admin>=6.6,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "respx>=0.21,<1", "ruff>=0.8,<1"]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls authoritative external sources"]

[tool.ruff]
line-length = 100
